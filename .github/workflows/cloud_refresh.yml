name: cloud-refresh
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: cloud-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Jana data awan
        run: python scripts/cloud_refresh.py
      - name: Commit jika berubah
        run: |
          git config user.name "cloud-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cloud_refresh.json
          if git diff --cached --quiet; then
            echo "tiada perubahan"
          else
            git commit -m "cloud refresh $(date -u +%FT%TZ)"
            git pull --rebase origin main || true
            git push
          fi
